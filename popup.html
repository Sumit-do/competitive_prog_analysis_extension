<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fira+Code:wght@400;500;600&display=swap');

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  width: 400px;
  max-height: 580px;
  overflow-y: auto;
  background: #14152a;
  color: #c8cfe8;
  font-family: 'Inter', system-ui, sans-serif;
  scrollbar-width: thin;
  scrollbar-color: rgba(255,255,255,0.06) transparent;
}
body::-webkit-scrollbar { width: 3px; }
body::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.06); }

/* ── HEADER ── */
.header {
  padding: 16px 18px 13px;
  border-bottom: 1px solid rgba(255,255,255,0.06);
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: #111220;
}
.header-left { display: flex; align-items: center; gap: 11px; }
.logo {
  width: 34px; height: 34px;
  background: linear-gradient(135deg, #6366f1 0%, #818cf8 100%);
  border-radius: 9px;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px;
  box-shadow: 0 4px 12px rgba(99,102,241,0.35);
}
.title {
  font-size: 14px;
  font-weight: 700;
  color: #e2e8f0;
  letter-spacing: -0.01em;
}
.subtitle {
  font-size: 10px;
  color: #3d4566;
  letter-spacing: 0.04em;
  margin-top: 2px;
}
.export-btn {
  all: unset;
  font-family: 'Inter', sans-serif;
  font-size: 10px;
  font-weight: 600;
  color: #3d4566;
  border: 1px solid rgba(255,255,255,0.07);
  padding: 6px 11px;
  border-radius: 7px;
  cursor: pointer;
  transition: all 0.15s;
  letter-spacing: 0.02em;
}
.export-btn:hover { color: #818cf8; border-color: rgba(129,140,248,0.35); background: rgba(129,140,248,0.06); }

/* ── CURRENT STATUS ── */
.current-status {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 9px 18px;
  background: rgba(255,255,255,0.025);
  border-bottom: 1px solid rgba(255,255,255,0.05);
}
.status-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
.status-text { font-size: 10.5px; color: #4a5578; }
.status-prob { font-size: 10.5px; font-weight: 600; color: #8892b0; font-family: 'Fira Code', monospace; }

/* ── STATS GRID ── */
.stats-row {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 1px;
  background: rgba(255,255,255,0.04);
}
.stat {
  background: #14152a;
  padding: 14px 10px 12px;
  text-align: center;
}
.stat-val {
  font-family: 'Inter', sans-serif;
  font-size: 22px;
  font-weight: 800;
  line-height: 1;
  letter-spacing: -0.02em;
}
.stat-lbl {
  font-size: 8.5px;
  font-weight: 600;
  color: #2e3655;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  margin-top: 5px;
}

/* ── SECTIONS ── */
.section {
  padding: 15px 18px;
  border-bottom: 1px solid rgba(255,255,255,0.04);
}
.sec-title {
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.14em;
  color: #2e3655;
  text-transform: uppercase;
  margin-bottom: 11px;
}

/* ── FAILURE BREAKDOWN ── */
.fail-row { display: flex; align-items: center; gap: 9px; margin-bottom: 8px; }
.fail-row:last-child { margin-bottom: 0; }
.fail-label { font-size: 10.5px; color: #5a6380; width: 138px; flex-shrink: 0; }
.fail-bar-wrap { flex: 1; height: 4px; background: rgba(255,255,255,0.04); border-radius: 3px; overflow: hidden; }
.fail-bar { height: 100%; border-radius: 3px; transition: width 0.5s ease; }
.fail-count {
  font-size: 9.5px;
  font-family: 'Fira Code', monospace;
  width: 22px;
  text-align: right;
  flex-shrink: 0;
}

/* ── ALGO CHIPS ── */
.algo-grid { display: flex; flex-wrap: wrap; gap: 5px; }
.algo-chip {
  font-family: 'Fira Code', monospace;
  font-size: 9.5px;
  font-weight: 500;
  padding: 4px 9px;
  border-radius: 6px;
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.06);
  color: #2e3655;
  transition: all 0.15s;
}
.algo-chip.has-data {
  border-color: rgba(129,140,248,0.3);
  color: #818cf8;
  background: rgba(129,140,248,0.07);
}
.algo-chip .algo-n {
  font-size: 8.5px;
  opacity: 0.7;
  margin-left: 3px;
}

/* ── RECENT PROBLEMS ── */
.prob-row {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 7px 0;
  border-bottom: 1px solid rgba(255,255,255,0.03);
}
.prob-row:last-child { border-bottom: none; }
.prob-status { font-size: 11px; font-weight: 700; width: 16px; flex-shrink: 0; }
.prob-name {
  font-family: 'Fira Code', monospace;
  font-size: 10.5px;
  color: #5a6380;
  flex: 1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.prob-time {
  font-size: 9.5px;
  color: #2e3655;
  flex-shrink: 0;
  font-family: 'Fira Code', monospace;
}
.prob-tags { display: flex; gap: 4px; flex-shrink: 0; }
.prob-tag {
  font-size: 8.5px;
  padding: 2px 6px;
  border-radius: 4px;
  border: 1px solid rgba(255,255,255,0.06);
  color: #2e3655;
  font-family: 'Fira Code', monospace;
}

/* ── BIG NUMBER ── */
.big-number {
  font-family: 'Inter', sans-serif;
  font-size: 32px;
  font-weight: 800;
  color: #e2e8f0;
  letter-spacing: -0.03em;
  line-height: 1;
  padding: 4px 0 2px;
}
.big-sub { font-size: 10px; color: #2e3655; margin-top: 4px; }

/* ── EMPTY STATE ── */
.empty-state {
  text-align: center;
  padding: 28px 20px;
  font-size: 11px;
  color: #2e3655;
  line-height: 2;
}
.empty-icon { font-size: 28px; margin-bottom: 8px; display: block; }
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <div class="logo">🧠</div>
    <div>
      <div class="title">CP Metacognition</div>
      <div class="subtitle">Pattern analysis dashboard</div>
    </div>
  </div>
  <button class="export-btn" id="export-btn">↓ Export</button>
</div>

<div id="current-status" class="current-status" style="display:none">
  <div class="status-dot" id="sdot"></div>
  <span class="status-text">Now solving</span>
  <span class="status-prob" id="sprob"></span>
  <span class="status-text" id="stime"></span>
</div>

<div id="main-content">
  <div class="empty-state" id="empty">
    <span class="empty-icon">🧩</span>
    No problems tracked yet.<br>
    Open a problem on AtCoder or Codeforces to begin.
  </div>
</div>

<script>
const FAILURE_TYPES = [
  { id: 'knowledge',   label: 'Knowledge Gap',       color: '#f87171' },
  { id: 'pattern',     label: 'Pattern Blindness',   color: '#fb923c' },
  { id: 'constraint',  label: 'Missed Constraint',   color: '#fbbf24' },
  { id: 'overthink',   label: 'Overthinking',         color: '#a78bfa' },
  { id: 'anchor',      label: 'Wrong First Instinct', color: '#e879f9' },
  { id: 'implement',   label: 'Implementation Bug',   color: '#38bdf8' },
];

const ALGO_TAGS = [
  'DP', 'BFS/DFS', 'Binary Search', 'Greedy', 'Segment Tree',
  'Two Pointers', 'Graph', 'Math', 'String', 'Bit Mask',
  'Divide & Conquer', 'Trie', 'Fenwick', 'Combinatorics', 'Other'
];

function formatTime(ms) {
  if (!ms || ms < 0) ms = 0;
  const s = Math.floor(ms / 1000), m = Math.floor(s / 60), h = Math.floor(m / 60);
  if (h > 0) return `${h}h ${m % 60}m`;
  if (m > 0) return `${m}m ${s % 60}s`;
  return `${s}s`;
}

function parseKey(k) {
  const p     = k.replace('metacog::', '');
  const parts = p.split('::');
  if (parts[0] === 'atcoder') return { platform: 'AC', contest: parts[1], prob: parts[2] };
  return { platform: 'CF', contest: parts[1], prob: parts[2] };
}

async function loadAll() {
  return new Promise(res => chrome.storage.local.get(null, items => res(items)));
}

async function init() {
  const all      = await loadAll();
  const metaKeys = Object.keys(all).filter(k => k.startsWith('metacog-meta::'));
  const dataKeys = Object.keys(all).filter(k => k.startsWith('metacog::') && !k.startsWith('metacog-meta::'));

  // ── Active-tab status ────────────────────────────────────────
  chrome.tabs.query({ active: true, currentWindow: true }, tabs => {
    const url = tabs[0]?.url || '';
    let probKey = null;

    if (url.includes('atcoder.jp')) {
      const m = url.match(/contests\/([^/]+)\/tasks\/([^/?#]+)/);
      if (m) probKey = `atcoder::${m[1]}::${m[2]}`;
    } else if (url.includes('codeforces.com')) {
      const m = url.match(/\/(\d+)(?:\/problem)?\/([A-Z0-9]+)/i);
      if (m) probKey = `cf::${m[1]}::${m[2]}`;
    }

    if (probKey) {
      const meta    = all[`metacog-meta::${probKey}`];
      const entries = all[`metacog::${probKey}`] || [];
      const label   = probKey
        .replace('atcoder::', 'AC ')
        .replace('cf::', 'CF ')
        .replace('::', ' / ')
        .toUpperCase();

      const status = meta?.status || 'active';
      const sdot   = document.getElementById('sdot');
      sdot.style.background = status === 'solved' ? '#34d399' : status === 'quit' ? '#f87171' : '#fbbf24';
      document.getElementById('sprob').textContent = label;
      document.getElementById('stime').textContent =
        status === 'active'
          ? `· ${entries.length} thoughts`
          : `· ${status.toUpperCase()} · ${formatTime(meta?.elapsed)}`;
      document.getElementById('current-status').style.display = 'flex';
    }
  });

  if (metaKeys.length === 0) return;
  document.getElementById('empty').style.display = 'none';

  // ── Aggregate ────────────────────────────────────────────────
  let totalSolved = 0, totalQuit = 0, totalTime = 0, timeCount = 0;
  const failCounts = {};
  const algoCounts = {};
  const recentProbs = [];

  FAILURE_TYPES.forEach(f => failCounts[f.id] = 0);
  ALGO_TAGS.forEach(a => algoCounts[a] = 0);

  metaKeys.forEach(mk => {
    const meta = all[mk];
    if (!meta) return;
    if (meta.status === 'solved') totalSolved++;
    if (meta.status === 'quit')   totalQuit++;
    if (meta.elapsed) { totalTime += meta.elapsed; timeCount++; }
    if (meta.failureType) failCounts[meta.failureType] = (failCounts[meta.failureType] || 0) + 1;
    if (meta.algoTags)    meta.algoTags.forEach(a => { algoCounts[a] = (algoCounts[a] || 0) + 1; });

    const info = parseKey(mk.replace('metacog-meta::', ''));
    recentProbs.push({
      key:         mk.replace('metacog-meta::', ''),
      platform:    info.platform,
      contest:     info.contest,
      prob:        info.prob,
      status:      meta.status,
      elapsed:     meta.elapsed,
      endTs:       meta.endTs || 0,
      algoTags:    meta.algoTags || [],
      failureType: meta.failureType,
    });
  });

  recentProbs.sort((a, b) => b.endTs - a.endTs);

  const total      = totalSolved + totalQuit;
  const solveRate  = total ? Math.round(totalSolved / total * 100) : 0;
  const avgTime    = timeCount ? Math.round(totalTime / timeCount / 60000) : 0;
  const totalThoughts = dataKeys.reduce((s, k) => s + (all[k]?.length || 0), 0);
  const maxFail    = Math.max(1, ...Object.values(failCounts));

  // ── Render ───────────────────────────────────────────────────
  document.getElementById('main-content').innerHTML = `
    <div class="stats-row">
      <div class="stat">
        <div class="stat-val" style="color:#34d399">${totalSolved}</div>
        <div class="stat-lbl">Solved</div>
      </div>
      <div class="stat">
        <div class="stat-val" style="color:#f87171">${totalQuit}</div>
        <div class="stat-lbl">Quit</div>
      </div>
      <div class="stat">
        <div class="stat-val" style="color:#fbbf24">${solveRate}%</div>
        <div class="stat-lbl">Solve rate</div>
      </div>
      <div class="stat">
        <div class="stat-val" style="color:#818cf8">${avgTime}m</div>
        <div class="stat-lbl">Avg time</div>
      </div>
    </div>

    <div class="section">
      <div class="sec-title">Where I tend to struggle</div>
      ${FAILURE_TYPES.map(f => {
        const c   = failCounts[f.id] || 0;
        const pct = Math.round(c / maxFail * 100);
        return `<div class="fail-row">
          <div class="fail-label">${f.label}</div>
          <div class="fail-bar-wrap">
            <div class="fail-bar" style="width:${pct}%;background:${f.color}"></div>
          </div>
          <div class="fail-count" style="color:${c > 0 ? f.color : '#2e3655'}">${c}</div>
        </div>`;
      }).join('')}
    </div>

    <div class="section">
      <div class="sec-title">Algorithm coverage</div>
      <div class="algo-grid">
        ${ALGO_TAGS.map(a => {
          const c = algoCounts[a] || 0;
          return `<div class="algo-chip ${c > 0 ? 'has-data' : ''}">
            ${a}${c > 0 ? `<span class="algo-n">${c}</span>` : ''}
          </div>`;
        }).join('')}
      </div>
    </div>

    <div class="section">
      <div class="sec-title">Recent problems</div>
      ${recentProbs.slice(0, 10).map(p => {
        const icon = p.status === 'solved'
          ? '<span style="color:#34d399">✓</span>'
          : p.status === 'quit'
          ? '<span style="color:#f87171">✕</span>'
          : '<span style="color:#fbbf24">…</span>';
        const label = `${p.platform} ${p.prob.toUpperCase()}`;
        const tags  = p.algoTags.slice(0, 2).map(a => `<span class="prob-tag">${a}</span>`).join('');
        return `<div class="prob-row">
          <div class="prob-status">${icon}</div>
          <div class="prob-name">${label}</div>
          <div class="prob-tags">${tags}</div>
          <div class="prob-time">${p.elapsed ? formatTime(p.elapsed) : ''}</div>
        </div>`;
      }).join('')}
    </div>

    <div class="section">
      <div class="sec-title">Total thoughts logged</div>
      <div class="big-number">${totalThoughts}</div>
      <div class="big-sub">across ${total} problem${total !== 1 ? 's' : ''}</div>
    </div>
  `;
}

// ── Export ───────────────────────────────────────────────────
document.getElementById('export-btn').addEventListener('click', async () => {
  const all = await loadAll();
  const out = {};
  Object.keys(all).forEach(k => { if (k.startsWith('metacog')) out[k] = all[k]; });
  const blob = new Blob([JSON.stringify(out, null, 2)], { type: 'application/json' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href     = url;
  a.download = `cp-metacog-${new Date().toISOString().slice(0, 10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
});

init();
</script>
</body>
</html>
